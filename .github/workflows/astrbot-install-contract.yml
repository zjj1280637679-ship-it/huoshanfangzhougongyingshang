name: AstrBot Install Contract

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref: [v4.27.3]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Clone AstrBot
        run: git clone --depth 1 --branch '${{ matrix.astrbot_ref }}' https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - name: Install AstrBot runtime
        run: uv sync --directory AstrBot
      - name: Initialize AstrBot
        shell: bash
        run: |
          set -euo pipefail
          touch AstrBot/.astrbot
          printf '\n' | uv run --directory AstrBot astrbot init
      - name: Install this exact repository ref through AstrBot
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          uv run --directory AstrBot python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import yaml

          repo = os.environ['REPOSITORY']
          branch = os.environ['SOURCE_BRANCH']
          repo_url = f'https://github.com/{repo}/tree/{branch}'

          try:
              from astrbot.core.star.updater import _PluginUpdater as RuntimeUpdater
          except ModuleNotFoundError:
              from astrbot.core.star.updator import PluginUpdator as RuntimeUpdater

          async def main():
              updater = RuntimeUpdater()
              path = await updater.install(repo_url)
              print(f'NATIVE_INSTALL_PATH={path}')

          asyncio.run(main())

          expected_repo = 'https://github.com/zjj1280637679-ship-it/huoshanfangzhougongyingshang'
          expected_name = 'astrbot_plugin_volcengine_native_video_provider'
          roots = []
          for metadata_path in Path('data/plugins').glob('*/metadata.yaml'):
              metadata = yaml.safe_load(metadata_path.read_text('utf-8')) or {}
              if metadata.get('name') == expected_name:
                  roots.append((metadata_path.parent, metadata))

          if len(roots) != 1:
              raise SystemExit(f'expected exactly one installed plugin root, got {roots}')

          root, metadata = roots[0]
          if not (root / 'metadata.yaml').is_file():
              raise SystemExit(f'metadata.yaml missing at installed root: {root}')
          if metadata.get('repo') != expected_repo:
              raise SystemExit(
                  f"metadata.repo mismatch: {metadata.get('repo')!r} != {expected_repo!r}"
              )
          if metadata.get('author') != '羊膜大人':
              raise SystemExit(f"metadata.author mismatch: {metadata.get('author')!r}")
          print(f'INSTALLED_ROOT={root}')
          print(f"PLUGIN_ID={metadata.get('author')}/{metadata.get('name')}")
          print(f"VERSION={metadata.get('version')}")
          print(f"REPO={metadata.get('repo')}")
          PY
      - name: Start AstrBot and verify plugin loads
        shell: bash
        run: |
          set -euo pipefail
          nohup uv run --directory AstrBot astrbot run --port 6185 >astrbot-install.log 2>&1 &
          pid=$!
          sleep 15
          cat astrbot-install.log
          if ! kill -0 "$pid" 2>/dev/null; then
            exit 1
          fi
          grep -F 'Plugin astrbot_plugin_volcengine_native_video_provider' astrbot-install.log
          grep -F 'Volcengine providers registered:' astrbot-install.log
          if grep -Eqi 'metadata\.ya?ml.*not found|Traceback|ERROR.*plugin' astrbot-install.log; then
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
